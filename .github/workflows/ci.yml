name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/html-to-markdown/go.mod
      - run: bun install --frozen-lockfile
      - run: bun run check-types
      - run: bun run check-slop
      - run: bun run test
      - run: bun run build
      - run: tools/html-to-markdown/smoke.sh
